# ==============================================================================
# Docker Compose Unificado - TCC IFNMG PagTesouro (Full-Stack)
# Repositório Principal: https://github.com/caiosilvacsv/TCC
# ==============================================================================
# Sobe de forma orquestrada todo o ecossistema com um único comando:
#   1. Banco de dados relacional (PostgreSQL 16 Alpine)
#   2. Backend corporativo REST (Spring Boot 4 / Java 25 Layered)
#   3. Frontend SPA (React + Vite) empacotado em Nginx Alpine com Gzip
#
# FONTE ÚNICA DE CREDENCIAIS: ./server/.env
# ==============================================================================

services:

  # -------------------------------------------------------------
  # 1. Banco de Dados PostgreSQL (Lê credenciais de ./server/.env)
  # -------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: tcc-postgres-db
    restart: unless-stopped
    env_file:
      - ./server/.env
    entrypoint:
      - /bin/sh
      - -c
      - |
        export POSTGRES_DB="$${POSTGRES_DB:-tcc_db}"
        export POSTGRES_USER="$${POSTGRESSQL_USER:-$${SPRING_DATASOURCE_USERNAME:-tcc_user}}"
        export POSTGRES_PASSWORD="$${POSTGRESSQL_PASSWORD:-$${SPRING_DATASOURCE_PASSWORD:-tcc_pass}}"
        exec docker-entrypoint.sh postgres
    ports:
      # Restrito ao loopback (127.0.0.1) para segurança em nuvem (acessível via SSH tunnel / local)
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRESSQL_USER:-$${SPRING_DATASOURCE_USERNAME:-tcc_user}} -d $${POSTGRES_DB:-tcc_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tcc-network

  # -------------------------------------------------------------
  # 2. Backend Spring Boot (tcc-server)
  # -------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tcc-backend-app
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      POSTGRESSQL_URL: jdbc:postgresql://db:5432/tcc_db
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    ports:
      # Restrito ao loopback (127.0.0.1); o tráfego público passa pelo Nginx (serviço 'web')
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tcc-network

  # -------------------------------------------------------------
  # 3. Frontend React SPA + Servidor Borda Nginx (tcc-web)
  # -------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: tcc-frontend-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      - server
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tcc-network

# -------------------------------------------------------------
# Volumes Persistentes e Redes Compartilhadas
# -------------------------------------------------------------
volumes:
  pgdata:
    driver: local

networks:
  tcc-network:
    driver: bridge
